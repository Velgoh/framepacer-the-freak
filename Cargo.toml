[package]
name = "framepacer-the-freak"
version = "0.1.0"
edition = "2024"
description = "Companion app that continuously sets FramePacer's FPS cap automatically (FramePacer itself is not modified)."
default-run = "framepacer-the-freak"

[lib]
name = "framepacer_the_freak"
path = "src/lib.rs"

[[bin]]
name = "framepacer-the-freak"
path = "src/main.rs"

# Scriptable D3D11 test "game" used for feasibility / end-to-end checks.
[[bin]]
name = "fp-testgame"
path = "src/bin/fp-testgame.rs"

# Phase-1 feasibility probe: sends FramePacer hotkeys and confirms them in FramePacer's log.
[[bin]]
name = "fp-probe"
path = "src/bin/fp-probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
eframe = "0.29.1"
egui = "0.29.1"
image = { version = "0.25", default-features = false, features = ["gif"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
